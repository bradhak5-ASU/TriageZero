[project]
name = "triagezero-backend"
version = "0.1.0"
description = "FastAPI backend scaffold for TriageZero"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.35",
  "psycopg[binary]>=3.2.1",
  "pydantic>=2.9.0",
  "alembic>=1.13.2"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
